site_name: Python Module
site_description: Python Training for BSIT Students (Kings College)

nav:
  - Python Basics:
    - Getting Started: index.md
    - Installation Guide: lectures/Installation.md
    - Introduction to Python: lectures/1.Introduction.md
    - Data Types: lectures/2.DataTypes.md
    - Control Structures: lectures/3.ControlStructures.md
    - Data Structures: lectures/4.DataStructures.md
    - Functions: lectures/5.Functions.md
    - File Handling: lectures/6.FileHandling.md
    - OOP: lectures/7.OOP.md
    - Errors and Exceptions: lectures/8.ErrorDebugging.md
    - Advanced Topics: lectures/9.AdvancedConcepts.md
  - Advanced Python:
    - Object Oriented Programming: prg400/OOP.md
    - Design Patterns (SOLID): prg400/SOLID_Principles.md
    - Event Driven Programming: prg400/EventDrivenProgramming.md
    - Async Programming: prg400/asyncio.md
    - Python Bindings (C/C++): prg400/PythonBindings.md
    - Creating Distributable Packages: prg400/DistributablePackage.md
    - FastAPI: prg400/FastAPI.md
    - Django Framework: prg400/Django.md
    - Deploying Applications: prg400/DeployingApplications.md
    - Vibe Coding: prg400/VibeCoding.md
    - Project Description (PRG400): prg400/ProjectDescription.md

theme:
  # name: material
  name: readthedocs
  features:
    - header.autohide
    - announce.dismiss
    - navigation.footer
  code:
    highlighting: true
    light: default
    dark: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - md_in_html
extra:
  generator: false
      
